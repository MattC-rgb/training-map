<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Jobs Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .legend {
      background: white;
      padding: 10px 12px;
      border-radius: 5px;
      font: 14px Arial, sans-serif;
      line-height: 1.7;
      box-shadow: 0 1px 5px #777;
    }

    .map-label {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 180px;
      white-space: nowrap;
    }

    .dot {
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #333;
      box-sizing: border-box;
      background: #f97316;
    }

    .open {
      outline: 4px solid #86efac;
      outline-offset: 2px;
    }

    .acknowledged {
      outline: 4px solid #166534;
      outline-offset: 2px;
    }

    .assigned {
      outline: 4px solid #93c5fd;
      outline-offset: 2px;
    }

    .onscene {
      outline: 4px solid #f97316;
      outline-offset: 2px;
    }

    .clear {
      outline: 4px solid #6b7280;
      outline-offset: 2px;
    }

    .label-text {
      display: inline-block;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #777;
      border-radius: 4px;
      padding: 3px 6px;
      font: bold 12px Arial, sans-serif;
      line-height: 1.3;
      color: #111;
      box-shadow: 0 1px 3px #777;
    }

    .map-error {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      font: 14px Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="message" class="map-error">Waiting for training jobs…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([-37.285443, 144.92095], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const markers = L.layerGroup().addTo(map);

    function getStatus(job) {
      const rawStatus = job.MapStatus ?? job.Status;
      const status = rawStatus && typeof rawStatus === "object"
        ? rawStatus.Value
        : rawStatus;

      return String(status || "Open").trim().toLowerCase();
    }

    function markerClass(status) {
      if (status === "open") return "open";
      if (status === "acknowledged") return "acknowledged";
      if (status === "assigned") return "assigned";

      if (status === "onscene" || status === "on scene") {
        return "onscene";
      }

      if (status === "clear" || status === "cleared") {
        return "clear";
      }

      return "";
    }

    function displayStatus(status) {
      if (status === "onscene" || status === "on scene") return "Onscene";
      if (status === "cleared") return "Clear";

      return status
        ? status.charAt(0).toUpperCase() + status.slice(1)
        : "Open";
    }

    function addLegend() {
      const legend = L.control({ position: "bottomright" });

      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");

        div.innerHTML =
          "<b>Training job status</b><br>" +
          '<span style="color:#86efac">●</span> Open<br>' +
          '<span style="color:#166534">●</span> Acknowledged<br>' +
          '<span style="color:#93c5fd">●</span> Assigned<br>' +
          '<span style="color:#f97316">●</span> Onscene<br>' +
          '<span style="color:#6b7280">●</span> Clear';

        return div;
      };

      legend.addTo(map);
    }

    addLegend();

    async function loadJobs() {
      const message = document.getElementById("message");

      try {
        const response = await fetch("./training-jobs.json?ts=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not load training-jobs.json");
        }

        const jobs = await response.json();
        markers.clearLayers();

        jobs.forEach(job => {
          const lat = Number(job.Lat);
          const lon = Number(job.Long);

          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

          const status = getStatus(job);
          const statusText = displayStatus(status);
          const jobNumber = job.JobID || "No job number";
          const vehicle = job.Vehicle || "No vehicle assigned";

          const icon = L.divIcon({
            className: "",
            html:
              '<div class="map-label">' +
                '<span class="dot ' + markerClass(status) + '"></span>' +
                '<span class="label-text">' +
                  jobNumber + "<br>" + vehicle +
                "</span>" +
              "</div>",
            iconSize: [190, 38],
            iconAnchor: [7, 7]
          });

          const marker = L.marker([lat, lon], { icon }).bindPopup(
            "<b>" + jobNumber + "</b><br>" +
            (job.JobType || "") + "<br>" +
            "Status: " + statusText + "<br>" +
            "Vehicle: " + vehicle + "<br>" +
            (job.Address || "") + "<br>" +
            (job.Suburb || "")
          );

          marker.addTo(markers);
        });

        message.textContent = jobs.length
          ? "Showing " + jobs.length + " training job(s)"
          : "No training jobs in the feed";
      } catch (error) {
        message.textContent = error.message;
      }
    }

    loadJobs();
    setInterval(loadJobs, 30000);
  </script>
</body>
</html>
