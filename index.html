<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Jobs Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .job-label {
      background: transparent;
      border: 0;
      box-shadow: none;
      color: #111;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
    }

    .job-label::before {
      display: none;
    }

    .status-dot {
      width: 18px;
      height: 18px;
      border: 2px solid #222;
      border-radius: 50%;
      box-sizing: border-box;
    }

    #map-status {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 50px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="map-status">Loading jobs…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const JOBS_URL =
      "https://mattc-rgb.github.io/training-map/training-jobs.json";

    const REFRESH_INTERVAL_MS = 5000;

    const map = L.map("map").setView([-37.3, 144.9], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    const statusElement = document.getElementById("map-status");

    function statusColour(status) {
      switch (String(status || "").trim().toLowerCase()) {
        case "open":
          return "#90EE90";       // light green
        case "acknowledged":
          return "#006400";       // dark green
        case "assigned":
          return "#87CEFA";       // light blue
        case "onscene":
        case "on scene":
          return "#FFA500";       // orange
        case "clear":
          return "#BDBDBD";       // grey
        default:
          return "#FFFFFF";
      }
    }

    function makeMarkerIcon(colour) {
      return L.divIcon({
        className: "",
        html: `<div class="status-dot" style="background:${colour}"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    function getField(job, names) {
      for (const name of names) {
        if (job[name] !== undefined && job[name] !== null) {
          return job[name];
        }
      }
      return "";
    }

    async function refreshMap() {
      try {
        const url = `${JOBS_URL}?_=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Feed returned HTTP ${response.status}`);
        }

        const jobs = await response.json();

        markersLayer.clearLayers();

        let plotted = 0;

        for (const job of jobs) {
          const lat = Number(getField(job, ["Lat", "lat"]));
          const lon = Number(getField(job, ["Long", "lon", "Lon", "long"]));

          if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
            continue;
          }

          const jobId = getField(job, ["JobID", "jobId", "jobID"]);
          const vehicle = getField(job, ["Vehicle", "vehicle"]);
          const address = getField(job, ["Address", "address"]);
          const suburb = getField(job, ["Suburb", "suburb"]);
          const agency = getField(job, ["agency", "Agency"]);
          const jobType = getField(job, ["JobType", "jobType", "type"]);
          const status = getField(job, ["MapStatus", "Status", "status"]);

          const marker = L.marker([lat, lon], {
            icon: makeMarkerIcon(statusColour(status))
          });

          marker.bindTooltip(
            `${jobId}${vehicle ? " - " + vehicle : ""}`,
            {
              permanent: true,
              direction: "right",
              offset: [10, 0],
              className: "job-label"
            }
          );

          marker.bindPopup(`
            <strong>${jobId || "Job"}</strong><br>
            ${address || ""}<br>
            ${suburb || ""}<br>
            ${jobType || ""}<br>
            ${agency || ""}<br>
            Status: ${status || ""}
            ${vehicle ? `<br>Vehicle: ${vehicle}` : ""}
          `);

          marker.addTo(markersLayer);
          plotted++;
        }

        statusElement.textContent =
          `Updated ${new Date().toLocaleTimeString()} · ${plotted} jobs`;

      } catch (error) {
        console.error("Map refresh failed:", error);
        statusElement.textContent = `Map refresh failed: ${error.message}`;
      }
    }

    refreshMap();
    setInterval(refreshMap, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
